    .language-switcher { text-align: right; margin-bottom: .5rem; font-size: .78rem; letter-spacing: .05em; }
    .language-switcher button { border: none; background: none; padding: 4px 6px; cursor: pointer; font: inherit; color: #777; letter-spacing: .05em; }
    .language-switcher button.active { color: #333; font-weight: 600; }
    .language-switcher span { color: #ddd; }
    .logo { width: 100%; max-width: 600px; margin: 0 auto 2rem; display: block; }
    .navigation { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 2rem; }
    .nav-button { display: inline-flex; align-items: center; padding: 12px 20px; font-weight: 600; font-size: 1rem; border-radius: 8px; text-decoration: none; color: white; background: #6a5acd; box-shadow: 0 3px 6px rgba(0,0,0,.2); }
    .nav-button:hover { background: #5941a9; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    .intro { font-size: 1rem; margin: 0 0 2rem; line-height: 1.5; }
       .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem 1rem; align-items: start; margin-top: 2rem; }
    .gallery-item { position: relative; display: block; width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 8px; }
    .photo-frame { display: block; position: relative; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,.1); transition: transform .3s ease; }
    .gallery-item img { display: block; width: 100%; height: auto; border-radius: 8px; }
    .gallery-item:nth-child(even) .photo-frame { transform: rotate(2deg); }
    .gallery-item:nth-child(odd) .photo-frame { transform: rotate(-2deg); }
    .gallery-item:hover, .gallery-item:focus-visible { z-index: 10; }
    .gallery-item:hover .photo-frame, .gallery-item:focus-visible .photo-frame { transform: scale(1.15) rotate(0deg); }
    .photo-count { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.78); color: #fff; border-radius: 5px; padding: 4px 6px; font-size: .875rem; line-height: 1.25; }
    .viewer-controls { display: flex; justify-content: center; align-items: center; gap: 14px; min-height: 44px; }
    .viewer-arrow { width: 44px; height: 44px; border: none; border-radius: 50%; color: #333; background: #fff; font-size: 1.5rem; cursor: pointer; }
    .viewer-arrow:disabled { opacity: .35; cursor: default; }
    .viewer-arrow[hidden] { display: none; }
    .viewer-counter { margin: 0; font-size: 1rem; min-width: 60px; }
    .viewer-stage { display: flex; justify-content: center; align-items: center; width: 100%; touch-action: pan-y pinch-zoom; }
    @media (hover: none) { .gallery-item:hover .photo-frame { transform: rotate(0deg); } }
    @media (prefers-reduced-motion: reduce) { .photo-frame { transition: none; } }
    button:focus-visible, a:focus-visible { outline: 3px solid #6a5acd; outline-offset: 4px; }
    .lightbox { border: none; padding: 0; background: transparent; width: 94vw; max-width: 1200px; max-height: 94dvh; color: #fff; overflow: visible; }
    .lightbox::backdrop { background: rgba(0,0,0,.9); }
    .lightbox-content { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .close-button { align-self: flex-end; border: 0; border-radius: 8px; padding: 10px 16px; background: #fff; color: #333; font: inherit; font-size: 1rem; cursor: pointer; }
    .large-image { display: block; max-width: 100%; max-height: calc(90dvh - 150px); object-fit: contain; border-radius: 8px; }
    @media (max-width: 768px) { body { padding: 1rem; } .gallery { grid-template-columns: repeat(3,minmax(0,1fr)); } .language-switcher { text-align: center; } }
    @media (max-width: 500px) { .gallery { grid-template-columns: repeat(2,minmax(0,1fr)); gap: .75rem; } }
  </style>

      {
        "src": "tons2.jpg",
        "no": "Negldesign 3",
        "en": "Nail design 3"
      }
    ]
  }
];
    const lightbox = document.getElementById('lightbox');
    const largeImage = document.getElementById('largeImage');
    const previousButton = document.getElementById('previousButton');
    const nextButton = document.getElementById('nextButton');
    const viewerCounter = document.getElementById('viewerCounter');
    const viewerStage = document.getElementById('viewerStage');
    let currentLanguage = 'no';
    let activeEntry = null;
    let photoIndex = 0;
    let previousOverflow = '';

    function updateViewer() {
      if (!activeEntry) return;
      const photo = activeEntry.photos[photoIndex];
      largeImage.src = photo.src;
      largeImage.alt = photo[currentLanguage];
      const count = activeEntry.photos.length;
      viewerCounter.textContent = (photoIndex + 1) + ' / ' + count;
      previousButton.hidden = nextButton.hidden = count === 1;
      previousButton.disabled = photoIndex === 0;
      nextButton.disabled = photoIndex === count - 1;
    }
    function movePhoto(direction) {
      if (!activeEntry) return;
      const nextIndex = photoIndex + direction;
      if (nextIndex < 0 || nextIndex >= activeEntry.photos.length) return;
      photoIndex = nextIndex;
      updateViewer();
    }
    function setLanguage(language) {
      currentLanguage = language === 'en' ? 'en' : 'no';
      const english = currentLanguage === 'en';
      document.documentElement.lang = currentLanguage;
      document.title = (english ? 'Gallery' : 'Galleri') + ' | Princezza Nails';
      document.querySelectorAll('[data-no]').forEach(element => {
        element.textContent = element.getAttribute('data-' + currentLanguage);
      });
      document.querySelectorAll('.gallery-item').forEach(button => {
        const entry = galleryEntries[Number(button.dataset.entry)];
        const label = entry.photos[0][currentLanguage];
        button.querySelector('img').alt = label;
        const count = entry.photos.length;
        button.setAttribute('aria-label', (english ? 'Open: ' : 'Åpne: ') + label +
          (count > 1 ? ', ' + count + (english ? ' photos' : ' bilder') : ''));
      });
      document.querySelectorAll('[data-count]').forEach(badge => {
        badge.textContent = badge.dataset.count + (english ? ' photos' : ' bilder');
      });
      ['no', 'en'].forEach(lang => {
        const button = document.getElementById(lang + 'Btn');
        button.classList.toggle('active', lang === currentLanguage);
        button.setAttribute('aria-pressed', String(lang === currentLanguage));
      });
      document.getElementById('homeLink').href = 'index.html?lang=' + currentLanguage;
      document.getElementById('logoLink').href = 'index.html?lang=' + currentLanguage;
      document.getElementById('aboutLink').href = 'ommeg.html?lang=' + currentLanguage;
      lightbox.setAttribute('aria-label', english ? 'Photo viewer' : 'Bildevisning');
      previousButton.setAttribute('aria-label', english ? 'Previous photo' : 'Forrige bilde');
      nextButton.setAttribute('aria-label', english ? 'Next photo' : 'Neste bilde');
      updateViewer();
      try { localStorage.setItem('princezzaLanguage', currentLanguage); } catch (error) {}
    }
    let savedLanguage = 'no';
    try { savedLanguage = localStorage.getItem('princezzaLanguage') || 'no'; } catch (error) {}
    const requestedLanguage = new URLSearchParams(location.search).get('lang');
    setLanguage(['no', 'en'].includes(requestedLanguage) ? requestedLanguage : savedLanguage);
    document.querySelectorAll('.gallery-item').forEach(button => {
      button.addEventListener('click', () => {
        activeEntry = galleryEntries[Number(button.dataset.entry)];
        photoIndex = 0;
        updateViewer();
        previousOverflow = document.body.style.overflow;
        lightbox.showModal();
        document.body.style.overflow = 'hidden';
        document.getElementById('closeButton').focus();
      });
    });
    previousButton.addEventListener('click', () => movePhoto(-1));
    nextButton.addEventListener('click', () => movePhoto(1));
    document.getElementById('closeButton').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        movePhoto(event.key === 'ArrowLeft' ? -1 : 1);
      }
    });
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) lightbox.close();
    });
    let touchStart = null;
    viewerStage.addEventListener('touchstart', event => {
      touchStart = event.touches.length === 1
        ? { x: event.touches[0].clientX, y: event.touches[0].clientY } : null;
    }, { passive: true });
    viewerStage.addEventListener('touchend', event => {
      if (!touchStart || event.touches.length || !event.changedTouches.length) {
        touchStart = null;
        return;
      }
      const dx = event.changedTouches[0].clientX - touchStart.x;
      const dy = event.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        movePhoto(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
    viewerStage.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });
    lightbox.addEventListener('close', () => {
      document.body.style.overflow = previousOverflow;
      largeImage.removeAttribute('src');
      largeImage.alt = '';
      activeEntry = null;
      touchStart = null;
    });
  </script>
</body>
</html>
