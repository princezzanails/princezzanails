<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Princezza_nails</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #fff;
      color: #333;
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    /* Logo */
    .logo {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 2rem auto;
      display: block;
    }

    /* NYTT: Om meg knapp container */
    .ommeg-container {
      margin-bottom: 1.5rem;
    }

    .ommeg-knapp {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      color: white;
      background-color: #6a5acd; /* lilla farge */
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: background-color 0.3s ease;
    }

    .ommeg-knapp:hover {
      background-color: #5941a9;
    }

    /* Modal styling */
    .modal {
      display: none; /* skjult som standard */
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fff;
      margin: auto;
      padding: 2rem;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: relative;
      text-align: left;
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .modal-content p {
      line-height: 1.5;
      font-size: 1rem;
      color: #333;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 16px;
      color: #333;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      background: none;
    }

    .close:hover {
      color: #6a5acd;
    }

    /* Video-boks */
    .video-boks {
      margin: 0 auto 2rem auto;
      max-width: 100%;
      position: relative;
    }

    .video-boks iframe {
      width: 560px;
      height: 315px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border: none;
    }

    /* Knapper */
    .knapper {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .knapp {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      color: white;
      transition: background-color 0.3s ease;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .knapp i {
      font-size: 1.3rem;
    }

    .tiktok { background-color: #000; }
    .tiktok:hover { background-color: #222; }

    .instagram {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }
    .instagram:hover { filter: brightness(1.1); }

    .youtube { background-color: #FF0000; }
    .youtube:hover { background-color: #cc0000; }

    .facebook { background-color: #1877F2; }
    .facebook:hover { background-color: #145dbf; }

    .messenger {
      background-color: #0084FF;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 1.1rem;
    }
    .messenger:hover {
      background-color: #006fdd;
    }

    /* Bildegalleri */
    .bildegalleri {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .bildegalleri img {
      width: 140px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .bildegalleri img:nth-child(even) { transform: rotate(2deg); }
    .bildegalleri img:nth-child(odd) { transform: rotate(-2deg); }

    .bildegalleri img:hover,
    .bildegalleri img:active {
      transform: scale(1.4) rotate(0deg);
      z-index: 10;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    /* Popup bilde container og styling */
    .popup-bilde-container {
      display: none; /* skjult som standard */
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .popup-bilde-container.active {
      display: flex;
    }

    .popup-bilde {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* NYTT: Kryss-knapp */
    .popup-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.8);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 20px;
      font-weight: bold;
      line-height: 30px;
      cursor: pointer;
      text-align: center;
      color: #333;
      transition: background-color 0.3s ease;
      z-index: 10;
    }

    .popup-close-btn:hover {
      background: rgba(255,255,255,1);
    }

    @media (max-width: 768px) {
      .video-boks iframe {
        width: 100%;
        height: auto;
      }

      .bildegalleri img {
        width: 100px;
      }
    }
  </style>
</head>
<body>

  <img src="princezza logo.jpeg" alt="Logo" class="logo" />

  <!-- NYTT: Om meg knapp under logoen -->
  <div class="ommeg-container">
    <button class="ommeg-knapp" id="openOmMeg">
      <i class="fas fa-user"></i> Om meg
    </button>
  </div>

  <!-- Modal vindu for Om meg -->
  <div id="omMegModal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="omMegTitle" aria-describedby="omMegDesc">
    <div class="modal-content">
      <button class="close" id="closeOmMeg" aria-label="Lukk modal">&times;</button>
      <h2 id="omMegTitle">Om meg</h2>
      <p id="omMegDesc">Hei! Jeg heter Princezza og driver med negldesign. Jeg brenner for å lage fine negler og inspirere andre. Velkommen til min nettside!</p>
    </div>
  </div>

  <div class="video-boks">
    <iframe src="https://www.youtube.com/embed/lnA3lwyAybM" title="YouTube video" allowfullscreen></iframe>
  </div>

  <div class="knapper">
    <a href="https://www.tiktok.com/@princezza_nails" class="knapp tiktok" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i> TikTok</a>
    <a href="https://www.instagram.com/princezza_nails/" class="knapp instagram" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i> Instagram</a>
    <a href="https://www.youtube.com/channel/UCEtg0sj2re99nOrxOYQnlqQ" class="knapp youtube" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i> YouTube</a>
    <a href="https://www.facebook.com/princezza.nails" class="knapp facebook" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook"></i> Facebook</a>
    <a href="https://www.messenger.com/t/100000412780392" class="knapp messenger" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-messenger"></i> Messenger</a>
  </div>

  <div class="bildegalleri">
    <img src="w.jpg" alt="Negl 1" />
    <img src="w1.jpg" alt="Negl 2" />
    <img src="w2.jpg" alt="Negl 3" />
    <img src="w3.jpg" alt="Negl 4" />
    <img src="w4.jpg" alt="Negl 5" />
    <img src="w5.jpg" alt="Negl 6" />
    <img src="w6.jpg" alt="Negl 7" />
    <img src="w7.jpg" alt="Negl 8" />
  </div>

  <!-- Popup bilde -->
  <div class="popup-bilde-container" id="popupBildeContainer" role="dialog" aria-modal="true" aria-label="Forstørret bilde">
    <button class="popup-close-btn" id="popupCloseBtn" aria-label="Lukk bildevisning">&times;</button>
    <img src="" alt="" class="popup-bilde" id="popupBilde" />
  </div>

  <script>
    // Modal funksjonalitet for "Om meg"
    const openOmMegBtn = document.getElementById('openOmMeg');
    const omMegModal = document.getElementById('omMegModal');
    const closeOmMegBtn = document.getElementById('closeOmMeg');

    openOmMegBtn.addEventListener('click', () => {
      omMegModal.style.display = 'flex';
      omMegModal.setAttribute('aria-hidden', 'false');
      // Fokuser close-knappen for tilgjengelighet
      closeOmMegBtn.focus();
    });

    closeOmMegBtn.addEventListener('click', () => {
      omMegModal.style.display = 'none';
      omMegModal.setAttribute('aria-hidden', 'true');
      openOmMegBtn.focus();
    });

    // Lukk modal ved å klikke utenfor modal-innholdet
    window.addEventListener('click', (event) => {
      if (event.target === omMegModal) {
        omMegModal.style.display = 'none';
        omMegModal.setAttribute('aria-hidden', 'true');
        openOmMegBtn.focus();
      }
    });

    // Popup bilde-funksjonalitet
    const bilder = document.querySelectorAll('.bildegalleri img');
    const popupContainer = document.getElementById('popupBildeContainer');
    const popupBilde = document.getElementById('popupBilde');
    const popupCloseBtn = document.getElementById('popupCloseBtn');

    bilder.forEach((bilde) => {
      bilde.addEventListener('click', () => {
        popupBilde.src = bilde.src;
        popupBilde.alt = bilde.alt;
        popupContainer.classList.add('active');
        popupCloseBtn.focus();
      });
    });

    popupCloseBtn.addEventListener('click', () => {
      popupContainer.classList.remove('active');
      popupBilde.src = '';
      popupBilde.alt = '';
    });

    // Lukk popup bilde ved å klikke utenfor bildet
    popupContainer.addEventListener('click', (e) => {
      if (e.target === popupContainer) {
        popupContainer.classList.remove('active');
        popupBilde.src = '';
        popupBilde.alt = '';
      }
    });

    // Tastaturstøtte for modal og popup (Escape)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (omMegModal.style.display === 'flex') {
          omMegModal.style.display = 'none';
          omMegModal.setAttribute('aria-hidden', 'true');
          openOmMegBtn.focus();
        }
        if (popupContainer.classList.contains('active')) {
          popupContainer.classList.remove('active');
          popupBilde.src = '';
          popupBilde.alt = '';
        }
      }
    });
  </script>

</body>
</html>
